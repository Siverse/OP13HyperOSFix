
name: Build OP13HyperOSFix APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-37
            build-tools;36.0.0
            ndk;28.2.13676358

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace

      - name: List APK files
        run: |
          find app/build/outputs/apk \
            -type f -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OP13HyperOSFix-Release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
