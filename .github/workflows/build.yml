
name: Build OP13HyperOSFix APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      ANDROID_HOME: ${{ github.workspace }}/.android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android command-line tools
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"

          curl -fL --retry 3 \
            https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip \
            -o /tmp/android-tools.zip

          unzip -q /tmp/android-tools.zip -d /tmp/android-tools

          cp -a /tmp/android-tools/cmdline-tools/. \
            "$ANDROID_HOME/cmdline-tools/latest/"

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Accept SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager \
            --sdk_root="$ANDROID_HOME" \
            --licenses > /tmp/licenses.log 2>&1
          result=${PIPESTATUS[1]}
          set -o pipefail

          tail -n 5 /tmp/licenses.log
          exit "$result"

      - name: Install Android 17 SDK and NDK
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager \
            --sdk_root="$ANDROID_HOME" \
            --channel=3 \
            --install \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;28.2.13676358"

          echo "=== Installed packages ==="
          sdkmanager \
            --sdk_root="$ANDROID_HOME" \
            --list_installed

          echo "=== Android platform information ==="
          find "$ANDROID_HOME/platforms" \
            -maxdepth 2 \
            -name source.properties \
            -exec sh -c 'echo "$1"; cat "$1"' _ {} \;

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Release APK
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          test -f "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OP13HyperOSFix-Release
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
          if-no-files-found: error
