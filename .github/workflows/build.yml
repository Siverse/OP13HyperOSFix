
name: Build OP13HyperOSFix APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate or install Android SDK tools
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools"

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager \
            -path "*/bin/sdkmanager" \
            -print -quit 2>/dev/null || true)

          if [ -z "$SDKMANAGER" ]; then
            echo "Installing Android command-line tools..."

            curl -fL --retry 3 \
              "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
              -o /tmp/cmdline-tools.zip

            mkdir -p /tmp/android-cmdline
            unzip -q /tmp/cmdline-tools.zip \
              -d /tmp/android-cmdline

            mkdir -p "$ANDROID_HOME/cmdline-tools/latest"

            cp -a /tmp/android-cmdline/cmdline-tools/. \
              "$ANDROID_HOME/cmdline-tools/latest/"

            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi

          chmod +x "$SDKMANAGER"

          SDKMANAGER_DIR=$(dirname "$SDKMANAGER")
          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          "$SDKMANAGER" --version

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail

          yes | "$SDKMANAGER" --licenses \
            >/dev/null || test "${PIPESTATUS[1]}" -eq 0

          "$SDKMANAGER" --install \
            "platforms;android-37" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

          "$SDKMANAGER" --list_installed

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        shell: bash
        run: chmod +x ./gradlew

      - name: Build Release APK
        shell: bash
        run: |
          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Find and prepare APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p output

          echo "=== Generated APKs ==="
          find app/build/outputs/apk \
            -type f -name "*.apk" -print

          APK=$(find app/build/outputs/apk/release \
            -type f -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK not found"
            exit 1
          fi

          cp "$APK" \
            output/OP13HyperOSFix-release.apk

          ls -lh output/
          sha256sum output/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OP13HyperOSFix-Release
          path: output/*.apk
          retention-days: 30
          if-no-files-found: error
